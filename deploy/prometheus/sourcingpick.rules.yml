groups:
  - name: sourcingpick
    rules:
      - alert: SourcingPickDown
        expr: up{job="sourcingpick"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Le serveur SourcingPick ne répond plus
          description: Prometheus n’arrive plus à lire les métriques depuis une minute.
      - alert: SourcingPickUnhealthy
        expr: sourcingpick_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Le serveur SourcingPick est dégradé
          description: La base, la mémoire ou le temps de réponse n’est plus dans les limites.
      - alert: SourcingPickDatabase
        expr: sourcingpick_db_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: La base SourcingPick ne répond plus
          description: Le contrôle `select 1` échoue depuis une minute.
      - alert: SourcingPickMemory
        expr: sourcingpick_memory_mb > 700
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: La mémoire de SourcingPick dépasse 700 Mo
          description: Le processus reste au-dessus de 700 Mo depuis 5 minutes.
      - alert: SourcingPickHttpErrors
        expr: sum(rate(sourcingpick_http_responses_total{status=~"5.."}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Le site renvoie des erreurs serveur
          description: Plus d’une réponse 5xx toutes les 20 secondes, pendant 5 minutes.
      - alert: SourcingPickSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(sourcingpick_http_duration_seconds_bucket{route="page"}[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Les pages SourcingPick sont lentes
          description: 95 % des pages mettent plus de 2 secondes à répondre.
      - alert: SourcingPickLag
        expr: sourcingpick_event_loop_lag_ms > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Le serveur SourcingPick répond lentement
          description: La boucle d’événements dépasse 500 ms depuis 5 minutes.
      - alert: SourcingPickRestartLoop
        expr: changes(process_start_time_seconds{job="sourcingpick"}[15m]) > 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Le serveur SourcingPick redémarre en boucle
          description: Le processus a redémarré plus de deux fois en 15 minutes.
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Redis ne répond plus
          description: Le cache Redis est injoignable. Le site continue en mémoire, mais les lectures répétées retournent à la base.
      - alert: RedisMemory
        expr: redis_memory_used_bytes > 48 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Redis approche de sa limite
          description: Le cache dépasse 48 Mo. Les clés temporaires seront effacées avant la clé de version.
      - alert: RedisSlow
        expr: sourcingpick_redis_ping_ms > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis répond lentement
          description: L’aller-retour local vers Redis dépasse 20 ms depuis 5 minutes.
      - alert: NetworkSlow
        expr: sourcingpick_net_rtt_ms > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: La latence réseau est haute
          description: La connexion vers l’extérieur dépasse 200 ms depuis 10 minutes.
      - alert: SiteSlow
        expr: probe_success{job="blackbox-http"} == 0 or probe_duration_seconds{job="blackbox-http"} > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Le site public répond mal
          description: La sonde HTTPS échoue, ou met plus de 1,5 s, depuis 5 minutes.

