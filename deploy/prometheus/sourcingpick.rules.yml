groups:
  - name: sourcingpick
    rules:
      - alert: SourcingPickDown
        expr: up{job="sourcingpick"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Le serveur SourcingPick ne répond plus
          description: Prometheus n’arrive plus à lire les métriques depuis une minute.
      - alert: SourcingPickUnhealthy
        expr: sourcingpick_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Le serveur SourcingPick est dégradé
          description: La base, la mémoire ou le temps de réponse n’est plus dans les limites.
      - alert: SourcingPickDatabase
        expr: sourcingpick_db_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: La base SourcingPick ne répond plus
          description: Le contrôle `select 1` échoue depuis une minute.
      - alert: SourcingPickMemory
        expr: sourcingpick_memory_mb > 700
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: La mémoire de SourcingPick dépasse 700 Mo
          description: Le processus reste au-dessus de 700 Mo depuis 5 minutes.
      - alert: SourcingPickHttpErrors
        expr: sum(rate(sourcingpick_http_responses_total{status=~"5.."}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Le site renvoie des erreurs serveur
          description: Plus d’une réponse 5xx toutes les 20 secondes, pendant 5 minutes.
      - alert: SourcingPickSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(sourcingpick_http_duration_seconds_bucket{route="page"}[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Les pages SourcingPick sont lentes
          description: 95 % des pages mettent plus de 2 secondes à répondre.
      - alert: SourcingPickLag
        expr: sourcingpick_event_loop_lag_ms > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Le serveur SourcingPick répond lentement
          description: La boucle d’événements dépasse 500 ms depuis 5 minutes.
      - alert: SourcingPickRestartLoop
        expr: changes(process_start_time_seconds{job="sourcingpick"}[15m]) > 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Le serveur SourcingPick redémarre en boucle
          description: Le processus a redémarré plus de deux fois en 15 minutes.
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Redis ne répond plus
          description: Le cache Redis est injoignable. Le site continue en mémoire, mais les lectures répétées retournent à la base.
      - alert: RedisMemory
        expr: redis_memory_max_bytes > 0 and redis_memory_used_bytes / redis_memory_max_bytes > 0.75
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: La mémoire Redis dépasse 75 %
          description: Le cache utilise plus des trois quarts de ses 64 Mo. Les clés temporaires seront effacées avant la clé de version.
      - alert: RedisEvicting
        expr: increase(redis_evicted_keys_total[15m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis efface des clés faute de place
          description: Plus de 10 clés ont été évincées en 15 minutes. Le cache est trop juste.
      - alert: RedisRejected
        expr: increase(redis_rejected_connections_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Redis refuse des connexions
          description: Redis n’accepte plus de nouvelle connexion. Le cache ne sert plus les lectures.
      - alert: RedisConnections
        expr: redis_connected_clients > 40
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Redis a trop de connexions
          description: Plus de 40 connexions restent ouvertes. Une connexion devrait suffire pour le site.
      - alert: RedisBlocked
        expr: redis_blocked_clients > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Des commandes Redis sont bloquées
          description: Redis fait attendre des clients depuis 5 minutes.
      - alert: RedisFragmentation
        expr: redis_memory_used_bytes > 8 * 1024 * 1024 and redis_mem_fragmentation_ratio > 1.8
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: La mémoire Redis est fragmentée
          description: Redis occupe beaucoup plus de mémoire réelle que les données qu’il garde.
      - alert: SourcingPickSqlSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(sourcingpick_sql_duration_seconds_bucket[5m]))) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Les requêtes de la base sont lentes
          description: 95 % des requêtes SQL mettent plus de 250 ms.
      - alert: PostgresDown
        expr: pg_exporter_last_scrape_error == 1 or up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL ne répond plus
          description: Les statistiques PostgreSQL ne sont plus lisibles.
      - alert: PostgresConnections
        expr: sum(pg_stat_activity_count) > 150
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL a beaucoup de connexions
          description: Plus de 150 sessions sont ouvertes depuis 10 minutes.
      - alert: PostgresSlowQueries
        expr: max(pg_stat_activity_max_tx_duration{state=~"active|idle in transaction"}) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Une requête PostgreSQL dure trop longtemps
          description: Une transaction reste ouverte plus de 30 secondes.
      - alert: PostgresCache
        expr: sum(rate(pg_stat_database_blks_hit{datname!="",datname!~"template.*"}[10m])) / clamp_min(sum(rate(pg_stat_database_blks_hit{datname!="",datname!~"template.*"}[10m])) + sum(rate(pg_stat_database_blks_read{datname!="",datname!~"template.*"}[10m])), 0.001) < 0.9
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL lit trop le disque
          description: Moins de 90 % des lectures viennent de la mémoire. Les requêtes ralentissent.
      - alert: RedisSlow
        expr: sourcingpick_redis_ping_ms > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis répond lentement
          description: L’aller-retour local vers Redis dépasse 20 ms depuis 5 minutes.
      - alert: NetworkSlow
        expr: sourcingpick_net_rtt_ms > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: La latence réseau est haute
          description: La connexion vers l’extérieur dépasse 200 ms depuis 10 minutes.
      - alert: SiteSlow
        expr: probe_success{job="blackbox-http"} == 0 or probe_duration_seconds{job="blackbox-http"} > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Le site public répond mal
          description: La sonde HTTPS échoue, ou met plus de 1,5 s, depuis 5 minutes.

