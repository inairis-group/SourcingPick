<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#155dfc" />
    <title>Hors ligne · SourcingPick</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f7f9fc;
        color: #0c2a6a;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #061029;
          color: #dce6ff;
        }
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #155dfc;
        color: #fff;
        font-weight: 700;
        font-size: 22px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 6px;
        font-size: 14px;
        line-height: 1.5;
        opacity: 0.75;
      }
      .en {
        opacity: 0.5;
        font-size: 13px;
      }
      button {
        margin-top: 20px;
        appearance: none;
        border: 0;
        border-radius: 10px;
        background: #155dfc;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 18px;
        cursor: pointer;
      }
      button:hover {
        background: #0a48d6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge" aria-hidden="true">SP</div>
      <h1>Vous êtes hors ligne</h1>
      <p>
        Impossible de joindre SourcingPick. Vérifiez votre connexion, puis
        réessayez.
      </p>
      <p class="en">You're offline. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Réessayer / Retry</button>
    </div>
  </body>
</html>
